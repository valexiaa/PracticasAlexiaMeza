<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

      let nombre = prompt("Nombre:");
let apellido = prompt("Apellido:");

let nota1 = prompt("Primera nota:");
let nota2 = prompt("Segunda nota:");
let nota3 = prompt("Tercera nota:");

let promedio = nota1 * 0.30 + nota2 * 0.35 + nota3 * 0.35;

document.write("Nombre: " + nombre + " " + apellido);
document.write("<br>Promedio: " + promedio);

    </script>
</body>
